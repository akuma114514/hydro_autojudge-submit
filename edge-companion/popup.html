<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydro Bridge</title>
  <style>
    body { width: 320px; padding: 16px; font: 14px system-ui, sans-serif; }
    textarea { box-sizing: border-box; width: 100%; height: 82px; margin: 8px 0; }
    button { padding: 7px 12px; }
    #status { margin-top: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <strong>Hydro 自动提交配对</strong>
  <p>在 VS Code 执行“Hydro: 复制 Edge 配对信息”，然后粘贴到此处。</p>
  <textarea id="pairing" placeholder='{"port":32167,"token":"..."}'></textarea>
  <button id="save">保存并检查</button>
  <hr>
  <button id="import-current">将当前题目导入 VS Code</button>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
